baseURL: "https://wanguiwaweru.github.io/"
title: "Node & Vector"
theme: PaperMod
mainsections:              
  - "posts"

pagination:
  pagerSize: 10
  
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Node & Vector"
  description: "My learning notes."
  keywords: [Blog, AI, Machine Learning]
  author: "Bernice Wangui "
  DateFormat: "January 2, 2006"
  defaultTheme: auto        # auto = follows system preference; or: dark / light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # ── Home page info block ──────────────────────────
  homeInfoParams:
    Title: "Hi there 👋"
    Content: |
      Welcome to my blog. I write about machine learning, research notes, and
      whatever I find interesting. Posts are my personal learning notes to help me understand things better.

  # ── Social icons shown on home page ─────────────────────────────────────
  socialIcons:
    - name: github
      url: "https://github.com/wanguiwaweru"
    - name: twitter
      url: "https://twitter.com/wanguiwaweru15"
    - name: rss
      url: "/index.xml"

  # ── Cover image defaults ─────────────────────────────────────────────────
  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  # ── Fuse.js search options ────────────────────────────────────────────────
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 1
    keys: ["title", "permalink", "summary", "content"]

# ── Menu (top nav bar) ───────────────────────────────────────────────────────
menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: faq
      name: FAQ
      url: /faq/
      weight: 50

# ── Taxonomies ───────────────────────────────────────────────────────────────
taxonomies:
  tag: tags
  category: categories

# ── Markup / syntax highlighting ─────────────────────────────────────────────
markup:
  goldmark:
    renderer:
      unsafe: true          # allows raw HTML in markdown
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

# ── Output formats (needed for search) ───────────────────────────────────────
outputs:
  home:
    - HTML
    - RSS
    - JSON
